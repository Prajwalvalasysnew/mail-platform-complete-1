# Production hardening overlay.
#
# Usage:
#   docker compose --env-file .env.production \
#     -f docker-compose.yml -f docker-compose.production.yml up -d --build
#
# Keep docker-compose.yml as the local development default. This overlay turns
# on production config enforcement, replaces development secrets with required
# env values, and prevents unauthenticated metrics scraping.

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  redis:
    ports: !reset []
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]

  haraka-outbound:
    environment:
      NODE_ENV: production
      DATABASE_URL: ${SERVICE_DATABASE_URL:?set SERVICE_DATABASE_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      HARAKA_OUTBOUND_PASS: ${HARAKA_OUTBOUND_PASS:?set HARAKA_OUTBOUND_PASS}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      KMS_PROVIDER: ${KMS_PROVIDER:?set KMS_PROVIDER}
      KMS_ALLOW_ENV_IN_PRODUCTION: ${KMS_ALLOW_ENV_IN_PRODUCTION:-false}
      AWS_REGION: ${AWS_REGION:-}
      AWS_KMS_ENCRYPTED_KEY: ${AWS_KMS_ENCRYPTED_KEY:-}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_TRANSIT_KEY: ${VAULT_TRANSIT_KEY:-}
      VAULT_TRANSIT_MOUNT: ${VAULT_TRANSIT_MOUNT:-transit}
      VAULT_ENCRYPTED_KEY: ${VAULT_ENCRYPTED_KEY:-}
      VERP_SECRET: ${VERP_SECRET:?set VERP_SECRET}
      DKIM_REQUIRED: "true"

  haraka-inbound:
    environment:
      NODE_ENV: production
      DATABASE_URL: ${SERVICE_DATABASE_URL:?set SERVICE_DATABASE_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      VERP_SECRET: ${VERP_SECRET:?set VERP_SECRET}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?set PLATFORM_DOMAIN}

  api:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      NODE_ENV: production
      DATABASE_URL: ${API_DATABASE_URL:?set API_DATABASE_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      KMS_PROVIDER: ${KMS_PROVIDER:?set KMS_PROVIDER}
      KMS_ALLOW_ENV_IN_PRODUCTION: ${KMS_ALLOW_ENV_IN_PRODUCTION:-false}
      AWS_REGION: ${AWS_REGION:-}
      AWS_KMS_ENCRYPTED_KEY: ${AWS_KMS_ENCRYPTED_KEY:-}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_TRANSIT_KEY: ${VAULT_TRANSIT_KEY:-}
      VAULT_TRANSIT_MOUNT: ${VAULT_TRANSIT_MOUNT:-transit}
      VAULT_ENCRYPTED_KEY: ${VAULT_ENCRYPTED_KEY:-}
      VERP_SECRET: ${VERP_SECRET:?set VERP_SECRET}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      API_KEY_PEPPER: ${API_KEY_PEPPER:?set API_KEY_PEPPER}
      ADMIN_SESSION_PEPPER: ${ADMIN_SESSION_PEPPER:?set ADMIN_SESSION_PEPPER}
      USER_SESSION_PEPPER: ${USER_SESSION_PEPPER:?set USER_SESSION_PEPPER}
      MFA_RECOVERY_PEPPER: ${MFA_RECOVERY_PEPPER:?set MFA_RECOVERY_PEPPER}
      ADMIN_PASSWORD_LOGIN_DISABLED: "true"
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?set PLATFORM_DOMAIN}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
      TRACKING_DOMAIN: ${TRACKING_DOMAIN:?set TRACKING_DOMAIN}
      BOUNCE_DOMAIN: ${BOUNCE_DOMAIN:?set BOUNCE_DOMAIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OIDC_REQUIRED_AUTH_CONTEXT: ${OIDC_REQUIRED_AUTH_CONTEXT:?set OIDC_REQUIRED_AUTH_CONTEXT}
      SEC_ARCHIVE_URL: ${SEC_ARCHIVE_URL:-}
      SEC_ARCHIVE_TOKEN: ${SEC_ARCHIVE_TOKEN:-}
      AUDIT_SIGNING_KEY_PEM: ${AUDIT_SIGNING_KEY_PEM:?set AUDIT_SIGNING_KEY_PEM}
      AUDIT_WORM_PROVIDER: ${AUDIT_WORM_PROVIDER:?set AUDIT_WORM_PROVIDER}
      AUDIT_WORM_S3_BUCKET: ${AUDIT_WORM_S3_BUCKET:?set AUDIT_WORM_S3_BUCKET}
      AUDIT_WORM_S3_KMS_KEY_ID: ${AUDIT_WORM_S3_KMS_KEY_ID:?set AUDIT_WORM_S3_KMS_KEY_ID}

  worker:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports: !reset []
    environment:
      NODE_ENV: production
      DATABASE_URL: ${SERVICE_DATABASE_URL:?set SERVICE_DATABASE_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      HARAKA_OUTBOUND_PASS: ${HARAKA_OUTBOUND_PASS:?set HARAKA_OUTBOUND_PASS}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      KMS_PROVIDER: ${KMS_PROVIDER:?set KMS_PROVIDER}
      KMS_ALLOW_ENV_IN_PRODUCTION: ${KMS_ALLOW_ENV_IN_PRODUCTION:-false}
      AWS_REGION: ${AWS_REGION:-}
      AWS_KMS_ENCRYPTED_KEY: ${AWS_KMS_ENCRYPTED_KEY:-}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_TRANSIT_KEY: ${VAULT_TRANSIT_KEY:-}
      VAULT_TRANSIT_MOUNT: ${VAULT_TRANSIT_MOUNT:-transit}
      VAULT_ENCRYPTED_KEY: ${VAULT_ENCRYPTED_KEY:-}
      VERP_SECRET: ${VERP_SECRET:?set VERP_SECRET}
      API_KEY_PEPPER: ${API_KEY_PEPPER:?set API_KEY_PEPPER}
      ADMIN_SESSION_PEPPER: ${ADMIN_SESSION_PEPPER:?set ADMIN_SESSION_PEPPER}
      USER_SESSION_PEPPER: ${USER_SESSION_PEPPER:?set USER_SESSION_PEPPER}
      MFA_RECOVERY_PEPPER: ${MFA_RECOVERY_PEPPER:?set MFA_RECOVERY_PEPPER}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      AUDIT_SIGNING_KEY_PEM: ${AUDIT_SIGNING_KEY_PEM:?set AUDIT_SIGNING_KEY_PEM}
      AUDIT_WORM_PROVIDER: ${AUDIT_WORM_PROVIDER:?set AUDIT_WORM_PROVIDER}
      AUDIT_WORM_S3_BUCKET: ${AUDIT_WORM_S3_BUCKET:?set AUDIT_WORM_S3_BUCKET}
      AUDIT_WORM_S3_KMS_KEY_ID: ${AUDIT_WORM_S3_KMS_KEY_ID:?set AUDIT_WORM_S3_KMS_KEY_ID}
      AUDIT_WORM_S3_REGION: ${AUDIT_WORM_S3_REGION:-}
      AUDIT_WORM_S3_ENDPOINT: ${AUDIT_WORM_S3_ENDPOINT:-}
      AUDIT_WORM_RETENTION_DAYS: ${AUDIT_WORM_RETENTION_DAYS:-2557}
      TRACKING_DOMAIN: ${TRACKING_DOMAIN:?set TRACKING_DOMAIN}
      BOUNCE_DOMAIN: ${BOUNCE_DOMAIN:?set BOUNCE_DOMAIN}
      DELIVERY_TRANSPORT: ${DELIVERY_TRANSPORT:?set DELIVERY_TRANSPORT}
      SES_SMTP_HOST: ${SES_SMTP_HOST:-}
      SES_SMTP_PORT: ${SES_SMTP_PORT:-587}
      SES_SMTP_USER: ${SES_SMTP_USER:-}
      SES_SMTP_PASS: ${SES_SMTP_PASS:-}
      SES_MAX_CONNECTIONS: ${SES_MAX_CONNECTIONS:-10}

  tracker:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      NODE_ENV: production
      DATABASE_URL: ${SERVICE_DATABASE_URL:?set SERVICE_DATABASE_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}

  smtp-gateway:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9102/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      NODE_ENV: production
      DATABASE_URL: ${SERVICE_DATABASE_URL:?set SERVICE_DATABASE_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      # STARTTLS material (required in production for AUTH over the wire):
      SMTP_TLS_KEY_FILE: ${SMTP_TLS_KEY_FILE:?set SMTP_TLS_KEY_FILE}
      SMTP_TLS_CERT_FILE: ${SMTP_TLS_CERT_FILE:?set SMTP_TLS_CERT_FILE}

  migrate:
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL}
