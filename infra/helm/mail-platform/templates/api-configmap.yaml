apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mail-platform.fullname" . }}-api-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mail-platform.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  {{- if .Values.customerUi.enabled }}
  {{- if not (hasKey .Values.api.env "APP_BASE_URL") }}
  APP_BASE_URL: {{ printf "https://%s" .Values.customerUi.ingress.host | quote }}
  {{- end }}
  {{- if not (hasKey .Values.api.env "CORS_ALLOWED_ORIGINS") }}
  CORS_ALLOWED_ORIGINS: {{ printf "https://%s" .Values.customerUi.ingress.host | quote }}
  {{- end }}
  {{- end }}
  {{- range $k, $v := .Values.api.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
