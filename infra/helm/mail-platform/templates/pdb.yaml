apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mail-platform.fullname" . }}-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mail-platform.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.api.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mail-platform.name" . }}
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mail-platform.fullname" . }}-worker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mail-platform.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.worker.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mail-platform.name" . }}
      app.kubernetes.io/component: worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mail-platform.fullname" . }}-tracker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mail-platform.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.tracker.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mail-platform.name" . }}
      app.kubernetes.io/component: tracker
