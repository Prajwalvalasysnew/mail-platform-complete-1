apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mail-platform.fullname" . }}-worker-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mail-platform.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  # Must match the containerPort/probe port in worker-deployment.yaml (9091).
  # The worker binary defaults to 9100, so without this the probes fail.
  WORKER_METRICS_PORT: "9091"
  {{- if .Values.haraka.outbound.enabled }}
  HARAKA_OUTBOUND_HOST: {{ printf "%s-haraka-outbound" (include "mail-platform.fullname" .) | quote }}
  HARAKA_OUTBOUND_PORT: {{ .Values.haraka.outbound.servicePort | quote }}
  {{- end }}
  {{- range $k, $v := .Values.worker.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
