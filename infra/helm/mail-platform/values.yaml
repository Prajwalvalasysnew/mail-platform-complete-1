# Default values for mail-platform Helm chart.
# Override in your environment via -f my-values.yaml or --set key=value.

global:
  image:
    registry: ghcr.io
    repository: your-org/mail-platform
    tag: latest
    pullPolicy: IfNotPresent

# ── API ───────────────────────────────────────────────────────────────────────
customerUi:
  enabled: false # Enable only after configuring the real public host/TLS secret.
  replicaCount: 2
  image:
    tag: ""
  service:
    port: 8080
  ingress:
    enabled: true
    className: nginx
    host: app.example.invalid
    tlsSecretName: customer-ui-tls
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

ai:
  enabled: false
  baseUrl: ""
  model: gpt-oss:120b
  allowCloud: false
  enabledTenants: ""
  concurrency: 1
  retentionHours: 24
  # Editor/assistant agent turns (DeepSeek Harness). The model route must serve the
  # OpenAI-compatible /v1/chat/completions API with tool calling (Ollama does).
  contextTokens: 32768
  maxOutputTokens: 8192
  agentTimeoutMs: 240000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1536Mi

api:
  replicaCount: 3
  image:
    tag: ""  # defaults to global.image.tag
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
  service:
    port: 3000
    type: ClusterIP
  ingress:
    enabled: true
    className: nginx
    host: api.mail-platform.example.com
    tlsSecretName: api-tls
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
  env:
    API_RATE_LIMIT_PER_MINUTE: "1000"
    SEND_RATE_LIMIT_PER_MINUTE: "300"
    SEND_QUEUE_BACKPRESSURE: "100000"
    MAX_CUSTOMER_QUEUE_DEPTH: "10000"
    WORKER_CONCURRENCY: "50"
    LOG_LEVEL: info

# ── Worker ────────────────────────────────────────────────────────────────────
worker:
  replicaCount: 2
  image:
    tag: ""  # defaults to global.image.tag
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "1Gi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
  env:
    WORKER_CONCURRENCY: "100"
    SEND_OUTBOX_DRAIN_LIMIT: "2000"
    LOG_LEVEL: info

haraka:
  outbound:
    enabled: true
    replicaCount: 1
    image:
      tag: ""
    servicePort: 2525
    tlsSecretName: haraka-outbound-tls
    queueStorage:
      size: 20Gi
      storageClassName: ""
    resources:
      requests: { cpu: "250m", memory: "256Mi" }
      limits: { cpu: "1000m", memory: "1Gi" }
  inbound:
    enabled: true
    replicaCount: 2
    image:
      tag: ""
    servicePort: 25
    containerPort: 2526
    serviceType: LoadBalancer
    loadBalancerIP: ""
    tlsSecretName: haraka-inbound-tls
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }

# ── Tracker ───────────────────────────────────────────────────────────────────
tracker:
  replicaCount: 2
  image:
    tag: ""  # defaults to global.image.tag
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  service:
    port: 4000
    type: ClusterIP
  ingress:
    enabled: true
    className: nginx
    host: t.mail-platform.example.com
    tlsSecretName: tracker-tls
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  env:
    LOG_LEVEL: info

# ── Shared secrets (references to existing Kubernetes Secret objects) ─────────
secrets:
  # Name of the Secret holding role-specific database URLs, REDIS_URL,
  # API_SECRET, etc.
  # Create this before installing the chart:
  #   kubectl create secret generic mail-platform-secrets \
  #     --from-env-file=.env.production
  existingSecret: mail-platform-secrets
  databaseKeys:
    api: API_DATABASE_URL
    service: SERVICE_DATABASE_URL
    migration: MIGRATION_DATABASE_URL

# ── Migration job ─────────────────────────────────────────────────────────────
migration:
  # Runs as a pre-install/pre-upgrade Helm hook.
  enabled: true
  image:
    tag: ""  # defaults to global.image.tag
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ── PodDisruptionBudgets ──────────────────────────────────────────────────────
pdb:
  api:
    minAvailable: 2
  worker:
    minAvailable: 1
  tracker:
    minAvailable: 1

# ── Namespace ─────────────────────────────────────────────────────────────────
namespace: mail-platform

# ── Network policies ─────────────────────────────────────────────────────────
# When enabled, deny-all default + per-service allow rules are created.
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium, Weave, etc.).
networkPolicy:
  enabled: true
