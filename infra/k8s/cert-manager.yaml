# cert-manager ClusterIssuers for automatic TLS via Let's Encrypt.
#
# Prerequisites:
#   1. Install cert-manager:
#        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#        kubectl wait --for=condition=Available deployment -n cert-manager --all --timeout=120s
#   2. Replace "ops@example.com" with your actual ops/security contact email.
#   3. Start with letsencrypt-staging to verify the flow, then switch Ingress
#      annotations to letsencrypt-prod once confirmed working.
#   4. The Ingress in mail-platform.yaml already references letsencrypt-prod via
#        cert-manager.io/cluster-issuer: letsencrypt-prod
#
# Apply:
#   kubectl apply -f infra/k8s/cert-manager.yaml
---
# Staging issuer — rate limits are very permissive; certs are NOT trusted by
# browsers but the workflow is identical. Validate here before using prod.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ops@example.com          # REPLACE: ops/security contact address
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
# Production issuer — rate-limited (50 certs/domain/week). Swap the Ingress
# annotation from letsencrypt-staging to letsencrypt-prod when ready.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@example.com          # REPLACE: ops/security contact address
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
# Optional: explicit Certificate CR (cert-manager also auto-issues from the
# Ingress TLS block, so this is only needed if you want to pre-provision or
# control renewal timing).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mail-tls
  namespace: mail-platform
spec:
  secretName: mail-tls              # must match Ingress spec.tls[].secretName
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - api.example.com               # REPLACE
    - track.example.com             # REPLACE
  # Renew 30 days before expiry (cert-manager default is 2/3 of validity).
  renewBefore: 720h                 # 30 days
