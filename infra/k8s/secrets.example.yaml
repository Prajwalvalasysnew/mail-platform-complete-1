# K8s secret template — DO NOT commit real values. Use SealedSecrets,
# External Secrets Operator (pulling from AWS Secrets Manager / Vault), or
# `kubectl create secret` from a CI vault step.
#
# Provided here as a reference for the exact env-var contract the app expects.
apiVersion: v1
kind: Secret
metadata:
  name: mail-secrets
  namespace: mail-platform
type: Opaque
stringData:
  DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/mail_platform?sslmode=require"
  REDIS_URL: "rediss://USER:PASSWORD@HOST:6379"
  JWT_SECRET: "REPLACE-WITH-64-BYTE-RANDOM"
  # When KMS_PROVIDER=env this is the AES-256-GCM master key (hex or base64).
  # When KMS_PROVIDER=aws/gcp/vault this is unused; the provider fetches it.
  ENCRYPTION_KEY: "REPLACE-WITH-32-BYTE-HEX"
  API_KEY_PEPPER: "REPLACE-WITH-32-BYTE-RANDOM"
  VERP_SECRET: "REPLACE-WITH-32-BYTE-RANDOM"
  ADMIN_SESSION_PEPPER: "REPLACE-WITH-32-BYTE-RANDOM"
  STRIPE_WEBHOOK_SECRET: "whsec_..."
  BODY_S3_BUCKET: "mail-platform-bodies-prod"
  BODY_S3_PREFIX: "bodies/"
  EVENTS_CLICKHOUSE_URL: "http://clickhouse:8123"
  TRACKING_DOMAIN: "https://track.example.com"
  BOUNCE_DOMAIN: "bounces.example.com"
