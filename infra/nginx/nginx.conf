# Example nginx config for production deployment.
# Terminates TLS in front of the API and Tracker services.
# Copy to /etc/nginx/sites-available/ and customize.

# ============= API =============
server {
    listen 443 ssl http2;
    server_name api.yourplatform.com;

    ssl_certificate     /etc/letsencrypt/live/api.yourplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourplatform.com/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Large body for bulk send
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

# ============= Tracker =============
# Separate domain so tracking links can't be blocked together with the API
server {
    listen 443 ssl http2;
    server_name track.yourplatform.com;

    ssl_certificate     /etc/letsencrypt/live/track.yourplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/track.yourplatform.com/privkey.pem;

    # Tracking pixels must serve fast; aggressive timeouts
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;

    # Allow many concurrent open-tracking requests
    keepalive_requests 10000;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ============= HTTP → HTTPS redirect =============
server {
    listen 80;
    server_name api.yourplatform.com track.yourplatform.com;

    # Allow ACME challenges for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
