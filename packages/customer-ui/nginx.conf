server {
  listen ${UI_LISTEN_PORT};
  server_name _;
  root /usr/share/nginx/html;

  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"customer-ui"}';
  }

  location /api/ {
    # Resolve the Compose service dynamically so this container can start (and
    # stay up) while the API is being recreated independently.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $api_upstream ${API_UPSTREAM};
    rewrite ^/api/(.*)$ /v1/$1 break;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
  location = /index.html {
    expires -1;
  }
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Compiled React, local fonts and editor assets; no CDN or runtime eval.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self'; font-src 'self' data:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}
