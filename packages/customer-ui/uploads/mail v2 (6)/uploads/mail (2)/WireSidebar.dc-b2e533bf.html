<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; flex-direction:column; width:220px; height:100%; box-sizing:border-box; background:#FAFAFB; border-right:1px solid #ECECEE; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; color:#0A0A0B; font-feature-settings:'tnum','ss01';">
  <div style="padding:11px 11px 0; flex-shrink:0;">
    <div style="display:flex; align-items:center; gap:9px; padding:7px 9px 7px 7px; border-radius:9px; cursor:pointer;" style-hover="background:rgba(10,10,11,0.04)">
      <div style="width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg, #6366F1 0%, #4338CA 100%); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 1px 2px rgba(67,56,202,0.28), 0 0 0 1px rgba(67,56,202,0.06);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3.5 7.5l8.5 6 8.5-6"></path></svg>
      </div>
      <div style="display:flex; flex-direction:column; line-height:1.2; min-width:0; flex:1;">
        <span style="font-size:13.5px; font-weight:600; letter-spacing:-0.005em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ brandTitle }}</span>
        <span style="font-size:10.5px; color:#8A8A92; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ brandSub }}</span>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A0A0AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M8 9l4 4 4-4"></path><path d="M8 15l4 4 4-4"></path></svg>
    </div>
  </div>
  <sc-if value="{{ showCta }}" hint-placeholder-val="{{ true }}">
    <div style="padding:8px 11px 6px; flex-shrink:0;">
      <div style="display:flex; align-items:center; gap:8px; height:34px; padding:0 10px 0 12px; background:#0A0A0B; color:#FFFFFF; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; box-shadow:0 1px 2px rgba(10,10,11,0.18), inset 0 1px 0 rgba(255,255,255,0.08); letter-spacing:-0.005em;" style-hover="background:#27272A">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <span style="flex:1;">{{ ctaLabel }}</span>
        <span style="font-size:10.5px; font-family:ui-monospace,Menlo,monospace; padding:1px 5px; background:rgba(255,255,255,0.14); border-radius:4px; color:rgba(255,255,255,0.82); flex-shrink:0; font-weight:500;">{{ ctaShortcut }}</span>
      </div>
    </div>
  </sc-if>
  <div style="flex:1; overflow:auto; padding:8px 11px 14px; display:flex; flex-direction:column; gap:14px;">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
      <div style="display:flex; flex-direction:column; gap:1px;">
        <span style="font-size:10.5px; font-weight:600; letter-spacing:.03em; color:#A0A0AB; padding:5px 10px 6px;">{{ g.label }}</span>
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
          <div style="display:flex; align-items:center; gap:10px; height:32px; padding:0 10px; border-radius:7px; cursor:pointer; background:{{ it.bg }}; color:{{ it.color }}; font-weight:{{ it.weight }}; font-size:13px; position:relative;" style-hover="background:rgba(10,10,11,0.04)">
            <span style="display:flex; align-items:center; flex-shrink:0; color:{{ it.iconColor }};">{{ it.icon }}</span>
            <span style="flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-0.005em;">{{ it.label }}</span>
            <sc-if value="{{ it.badge }}" hint-placeholder-val="">
              <span style="display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px; border-radius:5px; font-size:10.5px; font-weight:600; font-family:ui-monospace,Menlo,monospace; background:{{ it.badgeBg }}; color:{{ it.badgeColor }};">{{ it.badge }}</span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <div style="border-top:1px solid #ECECEE; padding:10px 11px; display:flex; flex-direction:column; gap:9px; flex-shrink:0;">
    <sc-if value="{{ showUsage }}" hint-placeholder-val="{{ true }}">
      <div style="padding:10px 11px 12px; background:#FFFFFF; border:1px solid #ECECEE; border-radius:8px; display:flex; flex-direction:column; gap:7px; box-shadow:0 1px 2px rgba(10,10,11,0.03);">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span style="font-size:11px; color:#56565B; font-weight:500;">{{ usageLabel }}</span>
          <span style="font-size:11px; color:#0A0A0B; font-family:ui-monospace,Menlo,monospace; font-weight:600;">{{ usageValue }}</span>
        </div>
        <div style="height:5px; border-radius:99px; background:#F0F0F2; overflow:hidden;">
          <div style="width:{{ usagePct }}%; height:100%; background:linear-gradient(90deg, #6366F1 0%, #4F46E5 100%); border-radius:99px;"></div>
        </div>
        <span style="font-size:10.5px; color:#8A8A92; line-height:1.4;">{{ usageSub }}</span>
      </div>
    </sc-if>
    <sc-if value="{{ showStatus }}" hint-placeholder-val="">
      <div style="display:flex; align-items:center; gap:8px; padding:9px 11px; background:#F0FDF4; border:1px solid #BBF7D0; border-radius:8px;">
        <span style="position:relative; width:7px; height:7px; border-radius:50%; background:#16A34A; flex-shrink:0; box-shadow:0 0 0 2.5px rgba(22,163,74,0.16);"></span>
        <span style="font-size:11.5px; color:#166534; font-weight:500;">All systems operational</span>
      </div>
    </sc-if>
    <div style="display:flex; align-items:center; gap:9px; padding:5px 6px; margin:0 -4px; border-radius:7px; cursor:pointer;" style-hover="background:rgba(10,10,11,0.04)">
      <div style="width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg, #818CF8 0%, #4F46E5 100%); color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; flex-shrink:0; box-shadow:0 0 0 1px rgba(79,70,229,0.12);">{{ userInitials }}</div>
      <div style="display:flex; flex-direction:column; line-height:1.25; min-width:0; flex:1;">
        <span style="font-size:12.5px; font-weight:600; letter-spacing:-0.005em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ userName }}</span>
        <span style="font-size:10.5px; color:#8A8A92; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ userRole }}</span>
      </div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A0A0AB" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="12" cy="5" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="12" cy="19" r="1.5"></circle></svg>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:620},&quot;scope&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;customer&quot;,&quot;admin&quot;],&quot;default&quot;:&quot;customer&quot;,&quot;tsType&quot;:&quot;\&quot;customer\&quot;|\&quot;admin\&quot;&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;overview&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  iconEl(name) {
    const h = React.createElement;
    const defs = {
      grid:[['rect',3,3,7,7,1.6],['rect',14,3,7,7,1.6],['rect',14,14,7,7,1.6],['rect',3,14,7,7,1.6]],
      activity:[['path','M3 12h3.5l2.2 6.5 4-13 2.3 6.5H21']],
      bars:[['line',5,21,5,10],['line',12,21,12,4],['line',19,21,19,14],['line',3.5,21,20.5,21]],
      globe:[['circle',12,12,9],['line',3,12,21,12],['path','M12 3c-3 2.7-3 15.3 0 18'],['path','M12 3c3 2.7 3 15.3 0 18']],
      doc:[['path','M7 3h7l4 4v14H7z'],['path','M14 3v4h4'],['line',10,12.5,15,12.5],['line',10,16,15,16]],
      ban:[['circle',12,12,9],['line',6,6,18,18]],
      link:[['line',9.5,14.5,14.5,9.5],['path','M11 6.5l1-1a4 4 0 015.6 5.6l-1 1'],['path','M13 17.5l-1 1a4 4 0 01-5.6-5.6l1-1']],
      key:[['circle',16,8,3.3],['line',13.7,10.3,5,19],['line',7.5,16.5,10,19],['line',5.5,18.5,8,21]],
      users:[['path','M16 20v-1.5a3.5 3.5 0 00-3.5-3.5H7A3.5 3.5 0 003.5 18.5V20'],['circle',9.3,8,3.3],['path','M19.5 20v-1.5a3.5 3.5 0 00-2.7-3.4'],['path','M14.5 4.7a3.3 3.3 0 010 6.4']],
      card:[['rect',3,6,18,12,2],['line',3,10,21,10]],
      chat:[['path','M20 11.5a7.5 7.5 0 01-10.9 6.7L4 20l1.8-5A7.5 7.5 0 1120 11.5z']],
      building:[['path','M4 21V6.5L11 3v18'],['path','M11 21V9.5L18 12v9'],['line',3,21,21,21],['line',7,8,7,8.01],['line',7,12,7,12.01],['line',7,16,7,16.01],['line',14.5,15,14.5,15.01]],
      gauge:[['path','M4 18a8 8 0 1116 0'],['line',12,18,15.5,9.5]],
      server:[['rect',4,5,16,5,1.5],['rect',4,14,16,5,1.5],['line',7.5,7.5,7.51,7.5],['line',7.5,16.5,7.51,16.5]],
      alert:[['path','M12 4.5l8.5 15H3.5z'],['line',12,10,12,14],['line',12,17,12,17.01]],
      shieldcheck:[['path','M12 3l8 3v6c0 5-3.5 7.7-8 9-4.5-1.3-8-4-8-9V6z'],['path','M9 12l2 2 4-4']],
      audit:[['path','M6 3h9l3 3v15H6z'],['line',9,9.5,15,9.5],['line',9,13,15,13],['line',9,16.5,13,16.5]],
      wallet:[['path','M3 8a2 2 0 012-2h12v4'],['path','M3 8v9a2 2 0 002 2h13a1 1 0 001-1v-7a1 1 0 00-1-1H5'],['line',16.5,12.5,16.51,12.5]],
      sliders:[['line',4,7,20,7],['line',4,12,20,12],['line',4,17,20,17],['circle',9,7,2.1],['circle',15,12,2.1],['circle',7,17,2.1]],
      inbox:[['path','M3 13l3-8h12l3 8v4a2 2 0 01-2 2H5a2 2 0 01-2-2z'],['path','M3 13h5l1.5 2.5h5L16 13h5']],
    };
    const make = (c, i) => {
      if (c[0] === 'path') return h('path', { key:i, d:c[1] });
      if (c[0] === 'circle') return h('circle', { key:i, cx:c[1], cy:c[2], r:c[3] });
      if (c[0] === 'line') return h('line', { key:i, x1:c[1], y1:c[2], x2:c[3], y2:c[4] });
      return h('rect', { key:i, x:c[1], y:c[2], width:c[3], height:c[4], rx:c[5] });
    };
    return h('svg', { width:17, height:17, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:1.75, strokeLinecap:'round', strokeLinejoin:'round', style:{ flexShrink:0, display:'block' } }, (defs[name]||[]).map(make));
  }

  renderVals() {
    const scope = this.props.scope ?? 'customer';
    const active = this.props.active ?? '';
    const customerGroups = [
      { label: 'Workspace', items: [
        { key: 'overview', label: 'Overview', icon: 'grid' },
        { key: 'activity', label: 'Email activity', icon: 'activity' },
        { key: 'analytics', label: 'Analytics', icon: 'bars' },
      ]},
      { label: 'Sending', items: [
        { key: 'domains', label: 'Domains', icon: 'globe' },
        { key: 'templates', label: 'Templates', icon: 'doc' },
        { key: 'suppressions', label: 'Suppressions', icon: 'ban' },
        { key: 'webhooks', label: 'Webhooks', icon: 'link' },
      ]},
      { label: 'Account', items: [
        { key: 'keys', label: 'API keys', icon: 'key' },
        { key: 'team', label: 'Team', icon: 'users' },
        { key: 'billing', label: 'Billing & usage', icon: 'card' },
        { key: 'support', label: 'Support', icon: 'chat', badge: '1' },
      ]},
    ];
    const adminGroups = [
      { label: 'Operations', items: [
        { key: 'overview', label: 'Fleet overview', icon: 'grid' },
        { key: 'tenants', label: 'Tenants', icon: 'building' },
        { key: 'deliverability', label: 'Deliverability', icon: 'gauge' },
        { key: 'pools', label: 'IP pools', icon: 'server' },
      ]},
      { label: 'Trust & safety', items: [
        { key: 'support', label: 'Support inbox', icon: 'inbox', badge: '2', urgent: true },
        { key: 'abuse', label: 'Abuse queue', icon: 'alert', badge: '6' },
        { key: 'kyc', label: 'KYC / verification', icon: 'shieldcheck' },
        { key: 'audit', label: 'Audit log', icon: 'audit' },
      ]},
      { label: 'Platform', items: [
        { key: 'billing', label: 'Billing & metering', icon: 'card' },
        { key: 'payments', label: 'Payment gateways', icon: 'wallet' },
        { key: 'settings', label: 'Settings', icon: 'sliders' },
      ]},
    ];
    const groups = (scope === 'admin' ? adminGroups : customerGroups).map(g => ({
      label: g.label,
      items: g.items.map(it => {
        const on = it.key === active;
        const urgent = !!it.urgent;
        return {
          label: it.label,
          icon: this.iconEl(it.icon),
          bg: on ? '#EEF2FF' : 'transparent',
          color: on ? '#4338CA' : '#56565B',
          iconColor: on ? '#4F46E5' : '#6E6E78',
          weight: on ? '600' : '500',
          badge: it.badge || '',
          badgeBg: urgent ? '#FEE2E2' : '#E4E4E7',
          badgeColor: urgent ? '#B91C1C' : '#52525B',
        };
      }),
    }));
    return {
      groups,
      brandTitle: scope === 'admin' ? 'Mail Platform' : 'Acme Inc',
      brandSub: scope === 'admin' ? 'Admin console' : 'acme.co · Pro plan',
      userInitials: scope === 'admin' ? 'SR' : 'AK',
      userName: scope === 'admin' ? 'Sofia Reyes' : 'Aisha Khan',
      userRole: scope === 'admin' ? 'Platform admin' : 'Owner',
      showCta: scope === 'customer',
      ctaLabel: 'Send email',
      ctaShortcut: 'C',
      showUsage: scope === 'customer',
      showStatus: scope === 'admin',
      usageLabel: 'Monthly quota',
      usageValue: '142k / 200k',
      usagePct: 71,
      usageSub: '29 days remaining',
    };
  }
}
</script>
</body>
</html>
