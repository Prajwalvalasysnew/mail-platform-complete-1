<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; align-items:center; gap:16px; height:56px; padding:0 22px; box-sizing:border-box; background:#FFFFFF; border-bottom:1px solid #ECECEE; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; color:#0A0A0B; font-feature-settings:'tnum','ss01';">
  <div style="display:flex; flex-direction:column; line-height:1.25; min-width:0; max-width:280px;">
    <span style="font-size:11px; color:#8A8A92; font-family:ui-monospace,'SF Mono',Menlo,monospace; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ crumb }}</span>
    <span style="font-size:16px; font-weight:600; letter-spacing:-0.012em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ title }}</span>
  </div>
  <div style="display:flex; align-items:center; height:36px; flex:1; max-width:360px; margin-left:8px; padding:0 10px 0 12px; border:1px solid #E5E5E7; border-radius:8px; background:#FAFAFB; gap:9px; color:#A0A0AB; cursor:pointer;" style-hover="background:#F5F5F6; border-color:#D4D4D8">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
    <span style="font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1;">{{ searchHint }}</span>
    <div style="display:flex; align-items:center; gap:3px; flex-shrink:0;">
      <span style="display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:19px; font-size:11px; font-family:ui-monospace,'SF Mono',Menlo,monospace; border:1px solid #D4D4D8; border-radius:4px; padding:0 4px; color:#56565B; background:#FFFFFF; font-weight:500;">⌘</span>
      <span style="display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:19px; font-size:11px; font-family:ui-monospace,'SF Mono',Menlo,monospace; border:1px solid #D4D4D8; border-radius:4px; padding:0 4px; color:#56565B; background:#FFFFFF; font-weight:500;">K</span>
    </div>
  </div>
  <div style="display:flex; align-items:center; gap:6px; margin-left:auto;">
    <div style="display:flex; align-items:center; gap:7px; height:30px; padding:0 11px 0 11px; border:1px solid #E5E5E7; border-radius:99px; font-size:12px; color:#0A0A0B; background:#FFFFFF; cursor:pointer; font-weight:500;" style-hover="background:#FAFAFB">
      <span style="position:relative; width:7px; height:7px; border-radius:50%; background:{{ envDot }}; flex-shrink:0; box-shadow:0 0 0 2.5px {{ envGlow }};"></span>
      <span style="white-space:nowrap; letter-spacing:-0.005em;">{{ env }}</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A0A0AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M8 10l4 4 4-4"></path></svg>
    </div>
    <div style="position:relative; width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#56565B; cursor:pointer;" style-hover="background:#F5F5F6">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M10.5 21a2 2 0 003 0"></path></svg>
      <span style="position:absolute; top:4px; right:4px; min-width:14px; height:14px; padding:0 3px; border-radius:99px; background:#DC2626; color:#FFFFFF; font-size:9.5px; font-weight:700; font-family:ui-monospace,Menlo,monospace; display:flex; align-items:center; justify-content:center; border:1.5px solid #FFFFFF; box-sizing:content-box; line-height:1;">3</span>
    </div>
    <div style="width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#56565B; cursor:pointer;" style-hover="background:#F5F5F6">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 014.6 1.3c0 1.7-2.1 2-2.1 3.2"></path><line x1="12" y1="17.2" x2="12" y2="17.21"></line></svg>
    </div>
    <span style="width:1px; height:22px; background:#ECECEE; flex-shrink:0; margin:0 4px;"></span>
    <div style="display:flex; align-items:center; gap:6px; cursor:pointer; padding:2px 7px 2px 2px; border-radius:99px; border:1px solid transparent;" style-hover="background:#F5F5F6; border-color:#E5E5E7">
      <div style="width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg, #818CF8 0%, #4F46E5 100%); color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; flex-shrink:0; box-shadow:0 0 0 1px rgba(79,70,229,0.12);">{{ avatar }}</div>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#A0A0AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M8 10l4 4 4-4"></path></svg>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:56},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Overview&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Acme Inc&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;env&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Production&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;searchHint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Search messages, domains, recipients…&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;avatar&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;AK&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const env = this.props.env ?? 'Production';
    const envColors = {
      Production: { dot: '#16A34A', glow: 'rgba(22,163,74,0.18)' },
      Test:       { dot: '#D97706', glow: 'rgba(217,119,6,0.18)' },
      Sandbox:    { dot: '#2563EB', glow: 'rgba(37,99,235,0.18)' },
    };
    const key = Object.keys(envColors).find(k => env.includes(k)) || 'Production';
    const cfg = envColors[key];
    return {
      title: this.props.title ?? 'Overview',
      crumb: this.props.crumb ?? 'Acme Inc',
      env,
      envDot: cfg.dot,
      envGlow: cfg.glow,
      searchHint: this.props.searchHint ?? 'Search messages, domains, recipients…',
      avatar: this.props.avatar ?? 'AK',
    };
  }
}
</script>
</body>
</html>
