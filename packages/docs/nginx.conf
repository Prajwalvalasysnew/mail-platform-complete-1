server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docusaurus uses client-side routing — serve index.html for all paths
    # so that deep links like /docs/guides/getting-started work on refresh.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache static assets aggressively (Docusaurus hashes filenames)
    location ~* \.(js|css|png|svg|ico|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for HTML (so new deploys are picked up immediately)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
}
