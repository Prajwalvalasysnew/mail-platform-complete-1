server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docusaurus emits one HTML file per page (directory-style URLs), so deep
    # links resolve to real files. Unknown paths get a real 404 status with
    # the site's own 404 page — never a soft-200 of the homepage (bad for
    # users and for search engines).
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache static assets aggressively (Docusaurus hashes filenames)
    location ~* \.(js|css|png|svg|ico|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for HTML (so new deploys are picked up immediately)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Baseline security headers for a public static site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
}
