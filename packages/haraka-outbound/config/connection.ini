; Connection-level config. Haraka 3.2.x reads several sections from this file
; at connection time and crashes if they are absent (it does not fully guard
; cfg.main / cfg.haproxy / cfg.message / cfg.uuid). We provide them all explicitly,
; matching the sections Hachecks read in connection.js.

[main]
strict_rfc1869=false
smtputf8=true

[haproxy]
; Hosts/CIDRs allowed to send the PROXY protocol. We run without HAProxy.
hosts[] =

[headers]
add_received=true
clean_auth_results=true
show_version=false
max_lines=1000
max_received=100

[message]
; Greeting banner shown after 220 on connect.
greeting[] = Mail Platform ESMTP
helo=Mail Platform at your service.
close=closing connection.

[uuid]
banner_chars=6
deny_chars=0

[max]
bytes=26214400
mime_parts=1000
line_length=512
data_line_length=992
