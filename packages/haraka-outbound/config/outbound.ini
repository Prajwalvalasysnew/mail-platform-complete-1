disabled=false
concurrency_max=100
connect_timeout=30
pool_timeout=50
pool_concurrency_max=10
ipv6_enabled=false
inet_prefer=v4

; Per-destination throttling - critical for deliverability
; Gmail/Outlook/Yahoo will tarpit or block on aggressive concurrency

[gmail.com]
concurrency_max=5

[googlemail.com]
concurrency_max=5

[outlook.com]
concurrency_max=3

[hotmail.com]
concurrency_max=3

[live.com]
concurrency_max=3

[yahoo.com]
concurrency_max=3

[aol.com]
concurrency_max=3

[icloud.com]
concurrency_max=5

[me.com]
concurrency_max=5

[mac.com]
concurrency_max=5
