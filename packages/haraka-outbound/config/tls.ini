; TLS / STARTTLS configuration for outbound MTA
; In production, point key/cert at your Let's Encrypt files
;
; [main]
; key=/etc/letsencrypt/live/mta1.yourdomain.com/privkey.pem
; cert=/etc/letsencrypt/live/mta1.yourdomain.com/fullchain.pem
;
; For local development, generate a self-signed cert:
;   openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 365 \
;     -subj "/CN=mta1.localhost"

[outbound]
key=
cert=

