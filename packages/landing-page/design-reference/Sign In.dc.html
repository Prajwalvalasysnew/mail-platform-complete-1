<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:oklch(0.985 0.003 250);color:oklch(0.17 0.02 255);font-feature-settings:"cv11","ss01";min-height:100vh;}
::selection{background:oklch(0.55 0.20 24 / 0.18);}
.disp{font-family:'Inter Tight',sans-serif;letter-spacing:-.02em;font-weight:700;}
.mono{font-family:'JetBrains Mono',monospace;}
.mut{color:oklch(0.47 0.015 255);}
.mut2{color:oklch(0.56 0.013 255);}
.authgrid{position:fixed;inset:0;background-image:linear-gradient(oklch(0.17 0.02 255/.04) 1px,transparent 1px),linear-gradient(90deg,oklch(0.17 0.02 255/.04) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse 70% 55% at 50% 0%,#000 30%,transparent 75%);pointer-events:none;}
.acard{width:100%;max-width:420px;background:#fff;border:1px solid oklch(0.90 0.008 252);border-radius:16px;box-shadow:0 1px 2px oklch(0.18 0.02 255/.05),0 16px 48px -16px oklch(0.18 0.02 255/.14);padding:36px;}
.lab{display:block;font-size:13px;font-weight:600;color:oklch(0.30 0.018 255);margin-bottom:7px;}
.inp{width:100%;height:44px;border-radius:9px;border:1.5px solid oklch(0.89 0.009 250);background:#fff;padding:0 14px;font-size:14px;font-family:inherit;color:oklch(0.20 0.02 255);transition:border-color .12s,box-shadow .12s;}
.inp:focus{outline:none;border-color:oklch(0.55 0.20 24);box-shadow:0 0 0 3px oklch(0.55 0.20 24/.11);}
.inp::placeholder{color:oklch(0.66 0.012 255);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:44px;padding:0 20px;border-radius:9px;font-size:14.5px;font-weight:600;text-decoration:none;cursor:pointer;border:0;font-family:inherit;white-space:nowrap;transition:background .13s,border-color .13s;}
.btnp{background:oklch(0.55 0.20 24);color:#fff;}
.btnp:hover{background:oklch(0.49 0.19 24);}
.btns{background:#fff;color:oklch(0.24 0.02 255);border:1px solid oklch(0.87 0.01 250);}
.btns:hover{border-color:oklch(0.72 0.015 250);background:oklch(0.985 0.003 250);}
.alink{color:oklch(0.50 0.19 24);font-weight:600;text-decoration:none;}
.alink:hover{text-decoration:underline;}
.divline{flex:1;height:1px;background:oklch(0.92 0.006 250);}
.eyebtn{position:absolute;right:6px;top:6px;width:32px;height:32px;border:0;background:transparent;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:oklch(0.55 0.013 255);}
.eyebtn:hover{background:oklch(0.965 0.004 250);color:oklch(0.30 0.018 255);}
</style>
</helmet>
<div class="authgrid"></div>
<div class="posrel col ac" style="min-height:100vh;padding:40px 24px;">
<a href="Valasys Mail Landing.dc.html" class="fx ac gap10" style="text-decoration:none;color:inherit;margin-top:24px;">
<span class="fx ac jc" style="width:36px;height:36px;border-radius:10px;background:oklch(0.55 0.20 24);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"></rect><path d="m2 7 10 6 10-6"></path></svg></span>
<span class="disp nowrap" style="font-size:19px;">Valasys <span style="font-weight:600;color:oklch(0.42 0.015 255);">Mail</span></span>
</a>
<div class="acard" style="margin-top:32px;">
<h1 class="disp" style="font-size:24px;letter-spacing:-.025em;">Sign in to your workspace</h1>
<p class="fs14 mut" style="margin-top:6px;line-height:1.5;">Welcome back. Your dashboard is waiting.</p>
<div class="col gap10" style="margin-top:26px;">
<button class="btn btns w100" onClick="{{ noop }}"><svg width="17" height="17" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"></path><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"></path><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"></path><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A10.97 10.97 0 0 0 12 1 11 11 0 0 0 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"></path></svg>Continue with Google</button>
<button class="btn btns w100" onClick="{{ noop }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Continue with SSO / SAML</button>
</div>
<div class="fx ac gap12" style="margin:22px 0;"><span class="divline"></span><span class="fs12 mut2 fw5">or with email</span><span class="divline"></span></div>
<form onSubmit="{{ onSubmit }}" class="col gap16">
<div><label class="lab" for="si-email">Work email</label><input class="inp" id="si-email" type="email" placeholder="you@company.com" required="required" /></div>
<div>
<div class="fx ac jb" style="margin-bottom:7px;"><label class="lab" for="si-pass" style="margin:0;">Password</label><a class="alink fs12" href="#">Forgot password?</a></div>
<div class="posrel"><input class="inp" id="si-pass" type="{{ passType }}" placeholder="••••••••••" required="required" style="padding-right:44px;" /><button type="button" class="eyebtn" onClick="{{ togglePass }}" aria-label="Toggle password visibility"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div>
</div>
<button type="submit" class="btn btnp w100">{{ submitLabel }}</button>
</form>
<sc-if value="{{ signedIn }}" hint-placeholder-val="">
<div class="fx ac gap10" style="margin-top:16px;padding:11px 14px;border-radius:9px;background:oklch(0.60 0.15 150/.10);border:1px solid oklch(0.60 0.15 150/.30);">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.50 0.13 150)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
<span class="fs13 fw6" style="color:oklch(0.38 0.10 150);">Signed in — redirecting to your dashboard…</span>
</div>
</sc-if>
</div>
<p class="fs14 mut" style="margin-top:22px;">New to Valasys Mail? <a class="alink" href="Create Account.dc.html">Create a free account</a></p>
<div class="fx ac gap16 fs12 mut2" style="margin-top:auto;padding-top:32px;">
<a href="Valasys Mail Landing.dc.html" class="mut2" style="text-decoration:none;">← Back to valasys.com</a>
<span>·</span><a href="#" class="mut2" style="text-decoration:none;">Privacy</a>
<span>·</span><a href="#" class="mut2" style="text-decoration:none;">Terms</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860}}">
class Component extends DCLogic {
  state = { showPass: false, signedIn: false };
  renderVals() {
    return {
      passType: this.state.showPass ? 'text' : 'password',
      togglePass: () => this.setState(s => ({ showPass: !s.showPass })),
      signedIn: this.state.signedIn,
      submitLabel: this.state.signedIn ? 'Signed in ✓' : 'Sign in',
      onSubmit: (e) => { e.preventDefault(); this.setState({ signedIn: true }); },
      noop: (e) => e.preventDefault(),
    };
  }
}
</script>
</body>
</html>
