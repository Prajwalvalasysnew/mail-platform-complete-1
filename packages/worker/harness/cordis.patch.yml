# Valasys agent profile, layered on the published DeepSeek Harness `sdk-minimal` bundle.
# The model gets ONLY the Valasys MCP tools: shell, terminals, sandbox/subprocess,
# file and working-directory tools and the DeepSeek-only adapter are disabled.
# The process receives no database, Redis or tenant credentials; every tool call
# goes back to the AI worker over a loopback MCP endpoint with a per-run token.
- id: llm-deepseek
  disabled: true
- id: persistent-bash
  disabled: true
- id: terminal-bash
  disabled: true
- id: terminal-pwsh
  disabled: true
- id: pty
  disabled: true
- id: subprocess
  disabled: true
- id: sandbox
  disabled: true
- id: sandbox-policy
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-working-directory
  disabled: true
- id: attachment-local
  disabled: true
- id: image-offload
  disabled: true
- id: jobs
  disabled: true
# Sized for the configured window (default 32k): the bundle's 64k headroom default makes the
# trigger negative, which disables proactive condensation; Ollama then drops the oldest
# messages (the request and instructions) silently instead of reporting an overflow.
- id: compaction-basic
  config:
    thresholdRatio: 0.7
    headroomTokens: 2048
    maxTokens: 4096
    retainRatio: 0.2
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: !!js process.env.VALASYS_SYSTEM_PROMPT
- insert:
    - id: llm-valasys
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          valasys:
            apiKeyEnv: VALASYS_LLM_KEY
            api: openai-completions
            baseURL: !!js process.env.VALASYS_LLM_BASE_URL
            # Ollama's OpenAI-compatible endpoint reads max_tokens and reasoning_effort.
            compat:
              maxTokensField: max_tokens
              supportsReasoningEffort: true
            models:
              - id: !!js process.env.VALASYS_LLM_MODEL
                name: Valasys AI
                contextWindow: !!js Number(process.env.VALASYS_LLM_CONTEXT)
                maxTokens: !!js Number(process.env.VALASYS_LLM_MAX_TOKENS)
                # Only reasoning models accept reasoning_effort; others are declared non-reasoning.
                reasoningEfforts: !!js "process.env.VALASYS_LLM_REASONING === '1' ? {low: 'low', medium: 'medium', high: 'high'} : false"
    # Trims oversized old tool outputs (email views, workspace reads) before condensation.
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 12000
        headChars: 6000
        tailChars: 1500
    - id: mcp-valasys
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: valasys
        transport: streamable-http
        url: !!js process.env.VALASYS_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.VALASYS_MCP_TOKEN}`'
        toolCallTimeoutMs: 30000
        failOnStartupError: true
        reconnect:
          enabled: false
